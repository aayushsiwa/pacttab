services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pacttab_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pacttab}:${POSTGRES_PASSWORD:-pacttab_secure_pass}@db:5432/${POSTGRES_DB:-pacttab}
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=${SESSION_SECRET:-pacttab_session_secret_change_in_prod_min_32_chars}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-pacttab_auth_secret_change_in_prod_min_32_chars}
      - BETTER_AUTH_URL=${APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_APP_URL=${APP_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  db:
    image: postgres:16-alpine
    container_name: pacttab_db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pacttab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pacttab_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-pacttab}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pacttab} -d ${POSTGRES_DB:-pacttab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pacttab_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
