name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (oxlint)
        run: pnpm lint
      - name: Format check (oxfmt)
        run: pnpm format:check
      - name: Typecheck
        run: pnpm exec tsc --noEmit

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pacttab
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: pacttab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pacttab -d pacttab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pacttab:secret@127.0.0.1:5432/pacttab_test
      REDIS_URL: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test (vitest)
        run: pnpm test
