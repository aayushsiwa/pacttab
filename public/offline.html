<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Offline — PactTab</title>
    <link rel="icon" href="/favicon-32x32.png" type="image/png" />
    <meta name="theme-color" content="#0f172a" />
    <style>
      :root {
        --bg: #0f172a;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --card: #1e293b;
        --border: #334155;
        --accent: #10b981;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background-color: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 36px 28px;
        max-width: 400px;
        width: 100%;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, #059669, #0d9488, #4f46e5);
        color: #fff;
        font-size: 32px;
        font-weight: 900;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        box-shadow: 0 10px 15px -3px rgba(5, 150, 105, 0.4);
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 8px;
        letter-spacing: -0.02em;
      }
      p {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 12px 20px;
        border-radius: 14px;
        background-color: var(--fg);
        color: var(--bg);
        font-size: 14px;
        font-weight: 700;
        border: none;
        cursor: pointer;
        text-decoration: none;
        transition: opacity 0.2s;
      }
      .btn:active {
        opacity: 0.85;
        transform: scale(0.99);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">₹</div>
      <h1>You're Offline</h1>
      <p>PactTab couldn't connect to the server. Check your internet connection and try again.</p>
      <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    </div>
  </body>
</html>
