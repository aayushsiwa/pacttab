<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Full bleed background for adaptive / maskable icon -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)" />
  <!-- Currency Emblem inside 80% safe zone (center ~256) -->
  <text x="256" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="220" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#glyphShadow)">₹</text>
  <!-- Subtle accent dot -->
  <circle cx="350" cy="170" r="14" fill="#34d399" opacity="0.9" />
</svg>